<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Colours repeat --color-accent and --color-bg-base from css/00-tokens.css; a favicon cannot read CSS tokens. -->
  <style>
    .tile { fill: #386889; }
    .bar { fill: #f8f6f1; }
    @media (prefers-color-scheme: dark) { .tile { fill: #5aa8b0; } .bar { fill: #0e1015; } }
  </style>
  <rect class="tile" width="32" height="32" rx="6"/>
  <rect class="bar" x="7" y="8" width="18" height="4" rx="1"/>
  <rect class="bar" x="7" y="14" width="11" height="4" rx="1"/>
  <rect class="bar" x="7" y="20" width="5" height="4" rx="1"/>
</svg>
