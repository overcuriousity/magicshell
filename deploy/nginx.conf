# nginx in front of magicshell on the same host. magicshell owns all security headers; add none here.
# Replace magicshell.example.org and the certificate paths. For an airgapped box see AIRGAP.md.

server {
    listen 80;
    listen [::]:80;
    server_name magicshell.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magicshell.example.org;

    ssl_certificate     /etc/ssl/certs/magicshell.example.org.pem;
    ssl_certificate_key /etc/ssl/private/magicshell.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The upstream call may take up to 60 s.
        proxy_read_timeout 90s;
    }
}
