# Every key is optional except endpoint and model in [app]. Environment variables override it as
# MAGICSHELL__SECTION__KEY, for example MAGICSHELL__BIND=127.0.0.1:9000 or MAGICSHELL__APP__MODEL=name.
# A key ending in _FILE reads the value from a file: MAGICSHELL__APP__API_KEY_FILE=/run/secrets/key.

# The https address users see. Required unless magicshell is reached via localhost.
# public_url = "https://magicshell.example.org"

bind = "127.0.0.1:8080"
trusted_proxies = ["127.0.0.1/32", "::1/128"]
# data_dir = "/var/lib/magicshell"

[app]
# Base address of the model endpoint (required). The server calls <endpoint>/systemone and nothing else.
# Environment: MAGICSHELL__APP__ENDPOINT
endpoint = "https://models.example.org/v1"
# The model to ask (required). Visitors cannot choose another one. Environment: MAGICSHELL__APP__MODEL
model = "decision-model"
# Bearer key for the endpoint; leave out if it needs none. "file:///run/secrets/key" reads it from a file.
# Environment: MAGICSHELL__APP__API_KEY or MAGICSHELL__APP__API_KEY_FILE
# api_key = "file:///run/secrets/magicshell-key"
# SQLite file name inside the data directory for accounts mode; leave out for open mode (no sign-in). Add users with `magicshell user add NAME`. Environment: MAGICSHELL__APP__DATABASE
# database = "magicshell.db"
# Questions one client may ask per minute (burst is the same number). Environment: MAGICSHELL__APP__RUNS_PER_MINUTE
runs_per_minute = 60
# Longest situation "Why?" accepts, in words; 0 turns "Why?" off. Well above 300 words a result over many questions can become too large to keep. Environment: MAGICSHELL__APP__WHY_MAX_WORDS
why_max_words = 300
# "Why?" questions one user may ask per minute, counted apart from runs (burst is the same number). Environment: MAGICSHELL__APP__WHY_PER_MINUTE
why_per_minute = 600
# Let the page warm the model up with one small request, at most once a minute, so a local model is loaded before the first question. Environment: MAGICSHELL__APP__PREHEAT
preheat = true
# Seconds to wait for the model before answering 504. Environment: MAGICSHELL__APP__UPSTREAM_TIMEOUT_SECS
upstream_timeout_secs = 60

# Single sign-on through an OpenID Connect provider. When present, it replaces the password sign-in; it needs database under [app].
# Redirect URI to register: scheme, host and port of public_url, then /auth/oidc/callback
# [auth.oidc]
# Issuer URL exactly as the provider publishes it, trailing slash included (required). Environment: MAGICSHELL__AUTH__OIDC__ISSUER
# issuer = "https://id.example.org"
# Client id registered with the provider (required). Environment: MAGICSHELL__AUTH__OIDC__CLIENT_ID
# client_id = "magicshell"
# Client secret (required). "file:///run/secrets/oidc" reads it from a file.
# Environment: MAGICSHELL__AUTH__OIDC__CLIENT_SECRET or MAGICSHELL__AUTH__OIDC__CLIENT_SECRET_FILE
# client_secret = "file:///run/secrets/magicshell-oidc"
# Scopes to request. Environment: MAGICSHELL__AUTH__OIDC__SCOPES
# scopes = ["openid", "profile"]
# Create an account on first sign-in instead of refusing people who have none. Environment: MAGICSHELL__AUTH__OIDC__AUTO_PROVISION
# auto_provision = false
# Text of the sign-in button. Environment: MAGICSHELL__AUTH__OIDC__DISPLAY_NAME
# display_name = "Sign in with SSO"
